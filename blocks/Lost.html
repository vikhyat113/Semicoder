<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Lost & Found | Semicoders</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-primary: #1e40af;
            --color-success: #16a34a;
            --color-warning: #ea580c;
            --color-danger: #dc2626;
            --color-text: #1f2937;
            --color-text-light: #6b7280;
            --color-bg: #f3f4f6;
            --color-white: #ffffff;
            --color-lost: #ef4444;
            --color-found: #22c55e;
            --color-match: #f59e0b;
            --radius: 16px;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 12px 24px rgba(0, 0, 0, 0.15);
            --space: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
        }

        /* Top Header */
        .top-header {
            background: var(--color-white);
            padding: var(--space);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--color-text);
            padding: 8px 12px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: var(--color-bg);
        }

        .branding {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--color-text);
        }

        .branding-logo {
            width: 40px;
            height: 40px;
            background: var(--color-success);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 20px;
        }

        .branding-text {
            font-weight: 700;
            font-size: 24px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--color-text);
            transition: opacity 0.2s;
        }

        .icon-btn:hover {
            opacity: 0.7;
        }

        /* Main Content */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .section-header {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-success) 100%);
            border-radius: var(--radius);
            padding: 2rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: var(--shadow);
        }

        .section-header h1 {
            font-size: 2rem;
            color: white;
            font-weight: 600;
        }

        .section-header i {
            font-size: 2.5rem;
            color: white;
        }

        /* Filter Section */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: var(--color-white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .filter-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-label {
            font-weight: 600;
            color: var(--color-text);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            border: 2px solid var(--color-text-light);
            background: var(--color-white);
            border-radius: 20px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .filter-btn:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }

        .filter-btn.active {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--color-white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
        }

        .card-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
            position: relative;
        }

        .card-status {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: white;
        }

        .status-lost {
            background: var(--color-lost);
        }

        .status-found {
            background: var(--color-found);
        }

        .status-claimed {
            background: var(--color-warning);
        }

        .status-resolved {
            background: var(--color-text-light);
        }

        .match-badge {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: var(--color-match);
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .card-body {
            padding: 1.5rem;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--color-text);
        }

        .card-category {
            display: inline-block;
            background: var(--color-bg);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--color-text-light);
            margin-bottom: 1rem;
        }

        .card-description {
            color: var(--color-text-light);
            margin-bottom: 1rem;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .card-location {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--color-text-light);
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            flex: 1;
            padding: 0.7rem 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
          margin-top: 20px;
            background: var(--color-primary);
            color: white;
        }

        .btn-primary:hover {
            background: #1e3a8a;
        }

        .btn-secondary {
          margin-top: 20px;
            background: var(--color-bg);
            height: 60px;
            color: var(--color-text);
            border: 2px solid var(--color-text-light);
        }

        .btn-secondary:hover {
            background: var(--color-text-light);
            color: white;
        }

        .contact-info {
            display: none;
            margin-top: 1rem;
            padding: 1rem;
            background: var(--color-bg);
            border-radius: 8px;
            border-left: 4px solid var(--color-success);
        }

        .contact-info.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0.5rem 0;
            font-size: 0.9rem;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            background: var(--color-white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .empty-state i {
            font-size: 3rem;
            color: var(--color-text-light);
            margin-bottom: 1rem;
        }

        .empty-state h3 {
            color: var(--color-text);
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            color: var(--color-text-light);
        }

        /* Status Flow */
        .status-flow {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            font-size: 0.8rem;
        }

        .flow-step {
            flex: 1;
            padding: 0.5rem;
            background: var(--color-bg);
            border-radius: 6px;
            text-align: center;
            color: var(--color-text-light);
            transition: var(--transition);
        }

        .flow-step.active {
            background: var(--color-success);
            color: white;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .section-header {
                padding: 1.5rem;
            }

            .section-header h1 {
                font-size: 1.5rem;
            }

            .section-header i {
                font-size: 2rem;
            }

            .cards-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .filters {
                flex-direction: column;
            }

            .filter-group {
                width: 100%;
            }

            .card-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
  
    <header class="top-header">
        <div class="header-left">
            <button class="back-btn" onclick="goBack()">← Back</button>
            <a href="#" class="branding">
                <div class="branding-logo">👤</div>
                <span class="branding-text">SEMICODERS</span>
            </a>
        </div>
        <nav class="header-right">
            <button class="icon-btn" aria-label="Notifications">🔔</button>
            <button class="icon-btn" aria-label="User Profile">👤</button>
        </nav>
    </header>

   
    <div class="container">
      
        <div class="section-header">
            <i class="fas fa-search"></i>
            <div>
                <h1>Lost & Found</h1>
                <p style="color: rgba(255,255,255,0.9); margin-top: 0.5rem;">Smart matching for lost and found items</p>
            </div>
        </div>

     
        <div class="filters">
            <div class="filter-group">
                <span class="filter-label"><i class="fas fa-list"></i> Category:</span>
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="lost">Lost</button>
                <button class="filter-btn" data-filter="found">Found</button>
                <button class="filter-btn" data-filter="for-sale">For Sale</button>
            </div>
            <div class="filter-group">
                <span class="filter-label"><i class="fas fa-map-marker-alt"></i> Location:</span>
                <button class="filter-btn active" data-location="all">All</button>
                <button class="filter-btn" data-location="hostel">Hostel</button>
                <button class="filter-btn" data-location="academic">Academic Block</button>
                <button class="filter-btn" data-location="library">Library</button>
                <button class="filter-btn" data-location="canteen">Canteen</button>
            </div>
        </div>

     
        <div class="cards-grid" id="itemsGrid">
       
        </div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <i class="fas fa-inbox"></i>
            <h3>No items found</h3>
            <p>Try adjusting your filters</p>
        </div>
    </div>

    <script>
     
        const items = [
            {
                id: 1,
                title: "Black Wallet",
                category: "lost",
                description: "Lost black leather wallet with college ID inside",
                emoji: "👛",
                location: "hostel",
                status: "lost", 
                contact: { name: "Raj Kumar", phone: "98XXXXXX23", email: "raj@college.edu" }
            },
            {
                id: 2,
                title: "Black Wallet",
                category: "found",
                description: "Found black leather wallet near hostel gate",
                emoji: "👛",
                location: "hostel",
                status: "found",
                contact: { name: "Priya Singh", phone: "97XXXXXX45", email: "priya@college.edu" }
            },
            {
                id: 3,
                title: "Blue Backpack",
                category: "lost",
                description: "Lost blue canvas backpack with laptop stickers",
                emoji: "🎒",
                location: "library",
                status: "lost",
                contact: { name: "Arjun Patel", phone: "99XXXXXX12", email: "arjun@college.edu" }
            },
            {
                id: 4,
                title: "Gold Ring",
                category: "found",
                description: "Found gold ring in library study area",
                emoji: "💍",
                location: "library",
                status: "found",
                contact: { name: "Sneha Sharma", phone: "96XXXXXX78", email: "sneha@college.edu" }
            },
            {
                id: 5,
                title: "Laptop Charger",
                category: "found",
                description: "Dell laptop charger found in academic block",
                emoji: "🔌",
                location: "academic",
                status: "claimed",
                contact: { name: "Vikram Reddy", phone: "95XXXXXX34", email: "vikram@college.edu" }
            },
            {
                id: 6,
                title: "Math Textbook",
                category: "for-sale",
                description: "Advanced Calculus textbook - barely used",
                emoji: "📖",
                location: "canteen",
                status: "lost",
                contact: { name: "Anjali Verma", phone: "94XXXXXX56", email: "anjali@college.edu" }
            }
        ];

        let activeCategory = 'all';
        let activeLocation = 'all';

    
        function checkPossibleMatch(item) {
            if (item.category === 'for-sale') return null;
            
            const oppositeCategory = item.category === 'lost' ? 'found' : 'lost';
            return items.find(otherItem => 
                otherItem.category === oppositeCategory && 
                otherItem.title.toLowerCase() === item.title.toLowerCase()
            );
        }

        function renderItems() {
            const grid = document.getElementById('itemsGrid');
            const emptyState = document.getElementById('emptyState');
            grid.innerHTML = '';

            const filtered = items.filter(item => {
                const categoryMatch = activeCategory === 'all' || item.category === activeCategory;
                const locationMatch = activeLocation === 'all' || item.location === activeLocation;
                return categoryMatch && locationMatch;
            });

            if (filtered.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            filtered.forEach(item => {
                const match = checkPossibleMatch(item);
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-image">
                        <span>${item.emoji}</span>
                        <div class="card-status status-${item.status}">
                            ${item.status.charAt(0).toUpperCase() + item.status.slice(1)}
                        </div>
                        ${match ? `<div class="match-badge">⚡ Possible Match Found</div>` : ''}
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">${item.title}</h3>
                        <span class="card-category">${item.category.toUpperCase()}</span>
                        <p class="card-description">${item.description}</p>
                        <div class="card-location">
                            <i class="fas fa-map-marker-alt"></i>
                            <span>${item.location.replace('-', ' ').toUpperCase()}</span>
                        </div>
                        <div class="status-flow">
                            <div class="flow-step ${item.status === 'lost' || item.status === 'found' ? 'active' : ''}">Posted</div>
                            <div class="flow-step ${item.status === 'claimed' ? 'active' : ''}">Claimed</div>
                            <div class="flow-step ${item.status === 'resolved' ? 'active' : ''}">Resolved</div>
                        </div>
                        <div class="card-actions">
                            <button class="btn btn-primary" onclick="toggleContact(this)">
                                <i class="fas fa-phone"></i> Request Contact
                            </button>
                            ${match ? `<button class="btn btn-secondary"><i class="fas fa-star"></i> Match Details</button>` : ''}
                        </div>
                        <div class="contact-info">
                            <div class="contact-item">
                                <i class="fas fa-user"></i>
                                <strong>${item.contact.name}</strong>
                            </div>
                            <div class="contact-item">
                                <i class="fas fa-phone"></i>
                                <span>${item.contact.phone}</span>
                            </div>
                            <div class="contact-item">
                                <i class="fas fa-envelope"></i>
                                <span>${item.contact.email}</span>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

       
        function toggleContact(btn) {
            const card = btn.closest('.card');
            const contactInfo = card.querySelector('.contact-info');
            contactInfo.classList.toggle('show');
            btn.textContent = contactInfo.classList.contains('show') ? '✓ Contact Info' : '📞 Request Contact';
        }

     
        document.querySelectorAll('[data-filter]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                activeCategory = this.dataset.filter;
                renderItems();
            });
        });

        document.querySelectorAll('[data-location]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('[data-location]').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                activeLocation = this.dataset.location;
                renderItems();
            });
        });

        function goBack() {
            window.history.back();
        }

      
        renderItems();
    </script>
</body>
</html>
