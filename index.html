<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semicoders - Student Portal</title>
    <link rel="stylesheet" href="home.css">
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

</head>
<body>
    
    <header>
        <a href="#" class="logo">
            <div class="logo-icon">👤</div>
            <span>SEMICODERS</span>
        </a>
        <nav class="header-actions">
            <button class="icon-btn" aria-label="Notifications">🔔</button>
            <button class="icon-btn" aria-label="User Profile">👤</button>
        </nav>
    </header>

  
    <main>
        <section class="grid">
            <article class="card card-primary">
                <div class="card-header">
                    <h2 class="card-title">ACADEMICS</h2>
                    <div class="card-badge">!</div>
                </div>
                <div>
                    <div class="card-icon">🎓</div>
                    <p class="card-subtitle">next class - Ce</p>
                </div>
            </article>

           
            <article class="card card-success">
                <div>
                    <h2 class="card-title">Mess</h2>
                    <div class="card-icon">🍽️</div>
                    <p class="card-subtitle">Lunch : Paneer</p>
                </div>
            </article>

            
            <article class="card card-warning">
                <div>
                    <h2 class="card-title">Notices<br>Events</h2>
                    <div class="card-icon">📢</div>
                </div>
            </article>

            
            <article class="card card-danger">
                <div>
                    <h2 class="card-title">Lost & <br>Found</h2>
                    <div class="card-icon">🎒</div>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
