<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CampSync Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .login-card {
      background: #ffffff;
      padding: 32px;
      width: 360px;
      border-radius: 18px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      border-color: e2e8f0;
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #38bdf8;
    }

    .tagline {
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 28px;
    }

    label {
      font-size: 13px;
      color: #27439d;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      margin-top: 6px;
      margin-bottom: 18px;
      border-radius: 10px;
      border: none;
      outline: none;
      background: #eaf2ff;
      color: #0e2852;
      font-size: 14px;
    }

    input::placeholder {
      color: #64748b;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: #38bdf8;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.9;
    }

    .error {
      margin-top: 14px;
      text-align: center;
      color: #f87171;
      font-size: 13px;
      display: none;
    }

    .note {
      margin-top: 20px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="login-card">
    <div class="logo">CampSync</div>
    <div class="tagline">Sync your campus life</div>

    <label>Email ID</label>
    <input
      type="email"
      id="email"
      placeholder="BT ID"
    />

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter password"
    />

    <button onclick="login()">Login</button>

    <div class="error" id="errorMsg">
      Invalid email or password
    </div>

    <div class="note">
      login page  
    </div>
  </div>

  <script>
    function login() {
      const email = document.querySelector('#email').value.trim();
      const password = document.querySelector('#password').value.trim();
      const errorMsg = document.querySelector('#errorMsg');

    
      if (
        (email === 'bt25cse041@iiitn.ac.in' && password === 'vix1') ||
        (email === 'bt25cse056@iiitn.ac.in' && password === 'cat1')
      ) {
        window.location.href = 'home.html';
      } else {
        errorMsg.style.display = 'block';
      }
    }
  </script>

</body>
</html>
